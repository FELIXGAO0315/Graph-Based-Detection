[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Graph-based detection of anomalous third-party relationship patterns (Duke MIDS capstone)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.6",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "networkx==3.4.2",
    "scikit-learn==1.5.2",
    "scipy==1.17.1",
    "Unidecode==1.3.8",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
